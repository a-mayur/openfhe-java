name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENFHE_VERSION: v1.6.1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # OpenFHE takes ~10 minutes to build, so the install is cached per version
      - name: Cache OpenFHE
        id: openfhe-cache
        uses: actions/cache@v4
        with:
          path: ~/openfhe
          key: openfhe-${{ env.OPENFHE_VERSION }}-ubuntu-24.04

      - name: Build OpenFHE
        if: steps.openfhe-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$OPENFHE_VERSION" https://github.com/openfheorg/openfhe-development.git "$RUNNER_TEMP/openfhe-src"
          cmake -S "$RUNNER_TEMP/openfhe-src" -B "$RUNNER_TEMP/openfhe-build" \
            -DCMAKE_INSTALL_PREFIX="$HOME/openfhe" -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_UNITTESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF
          cmake --build "$RUNNER_TEMP/openfhe-build" -j"$(nproc)"
          cmake --install "$RUNNER_TEMP/openfhe-build"

      - name: Build and test
        # bash instead of ./gradlew: uploads through the GitHub web UI drop the executable bit
        run: bash ./gradlew -Popenfhe.home="$HOME/openfhe" build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests
